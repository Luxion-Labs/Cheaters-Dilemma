<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <linearGradient id="cheat-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08060D" />
      <stop offset="50%" stop-color="#140A1E" />
      <stop offset="100%" stop-color="#050308" />
    </linearGradient>
    <linearGradient id="amber-violet" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="50%" stop-color="#EC4899" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>
    <radialGradient id="game-glow" cx="75%" cy="50%" r="45%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.3" />
      <stop offset="40%" stop-color="#8B5CF6" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#08060D" stop-opacity="0" />
    </radialGradient>
    <pattern id="matrix-grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M 34 0 L 0 0 0 34" fill="none" stroke="#F59E0B" stroke-width="0.5" stroke-opacity="0.05" />
    </pattern>
  </defs>

  <rect width="1200" height="420" fill="url(#cheat-bg)" />
  <rect width="1200" height="420" fill="url(#game-glow)" />
  <rect width="1200" height="420" fill="url(#matrix-grid)" />

  <rect x="20" y="20" width="1160" height="380" rx="14" fill="none" stroke="#F59E0B" stroke-width="1" stroke-opacity="0.2" />

  <!-- Game Theory Art (Right Side) -->
  <g transform="translate(850, 210)">
    <!-- Payoff Matrix 2x2 Grid Wireframe -->
    <rect x="-140" y="-100" width="280" height="200" rx="8" fill="#12081C" stroke="#8B5CF6" stroke-width="1.5" stroke-opacity="0.5" />
    <line x1="0" y1="-100" x2="0" y2="100" stroke="#8B5CF6" stroke-width="1" stroke-opacity="0.4" stroke-dasharray="4 4" />
    <line x1="-140" y1="0" x2="140" y2="0" stroke="#8B5CF6" stroke-width="1" stroke-opacity="0.4" stroke-dasharray="4 4" />

    <!-- Matrix Cells with Payoff Scores -->
    <text x="-70" y="-45" fill="#10B981" font-family="'SF Mono', monospace" font-size="14" font-weight="700" text-anchor="middle">(+3, +3)</text>
    <text x="-70" y="-25" fill="#64748B" font-family="'SF Mono', monospace" font-size="10" text-anchor="middle">COOPERATE</text>

    <text x="70" y="-45" fill="#EF4444" font-family="'SF Mono', monospace" font-size="14" font-weight="700" text-anchor="middle">(+5, 0)</text>
    <text x="70" y="-25" fill="#F59E0B" font-family="'SF Mono', monospace" font-size="10" text-anchor="middle">DEFECT (EXPLOIT)</text>

    <text x="-70" y="45" fill="#EF4444" font-family="'SF Mono', monospace" font-size="14" font-weight="700" text-anchor="middle">(0, +5)</text>
    <text x="-70" y="65" fill="#64748B" font-family="'SF Mono', monospace" font-size="10" text-anchor="middle">SUCKER PAYOFF</text>

    <text x="70" y="45" fill="#94A3B8" font-family="'SF Mono', monospace" font-size="14" font-weight="700" text-anchor="middle">(+1, +1)</text>
    <text x="70" y="65" fill="#EF4444" font-family="'SF Mono', monospace" font-size="10" text-anchor="middle">MUTUAL DEFECTION</text>

    <!-- Floating Agent Syndicate Nodes -->
    <g transform="translate(-140, -100)">
      <circle cx="0" cy="0" r="16" fill="#1E0E2B" stroke="#F59E0B" stroke-width="2" />
      <text x="0" y="4" fill="#F59E0B" font-family="'SF Mono', monospace" font-size="10" font-weight="700" text-anchor="middle">A1</text>
    </g>
    <g transform="translate(140, 100)">
      <circle cx="0" cy="0" r="16" fill="#1E0E2B" stroke="#EF4444" stroke-width="2" />
      <text x="0" y="4" fill="#EF4444" font-family="'SF Mono', monospace" font-size="10" font-weight="700" text-anchor="middle">A2</text>
    </g>

    <text x="0" y="130" fill="#94A3B8" font-family="'SF Mono', monospace" font-size="11" letter-spacing="1" text-anchor="middle">NASH EQUILIBRIUM: REPEATED ROUNDS</text>
  </g>

  <!-- Content (Left Side) -->
  <g transform="translate(70, 75)">
    <rect width="240" height="30" rx="15" fill="#F59E0B" fill-opacity="0.12" stroke="#F59E0B" stroke-width="1" stroke-opacity="0.4" />
    <circle cx="16" cy="15" r="4" fill="#F59E0B" />
    <text x="28" y="19" fill="#F59E0B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="1.2">GAME THEORY AGENT SIMULATION</text>

    <text x="0" y="85" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="800" letter-spacing="-1.5">
      Cheaters Dilemma
    </text>

    <rect x="0" y="105" width="90" height="4" rx="2" fill="url(#amber-violet)" />

    <text x="0" y="150" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="400" letter-spacing="-0.2">
      Multi-agent simulation of competition, alliances, and defection in token economies.
    </text>

    <text x="0" y="180" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="400">
      Modeling emergent cartel formation and strategic betrayal with Python Mesa and Solidity.
    </text>

    <g transform="translate(0, 240)">
      <rect width="170" height="34" rx="8" fill="#FFFFFF" fill-opacity="0.03" stroke="#FFFFFF" stroke-width="1" stroke-opacity="0.08" />
      <text x="14" y="22" fill="#94A3B8" font-family="'SF Mono', monospace" font-size="11">SIMULATION: MESA</text>

      <rect x="185" y="0" width="180" height="34" rx="8" fill="#FFFFFF" fill-opacity="0.03" stroke="#FFFFFF" stroke-width="1" stroke-opacity="0.08" />
      <text x="199" y="22" fill="#94A3B8" font-family="'SF Mono', monospace" font-size="11">CONTRACTS: SOLIDITY</text>

      <rect x="380" y="0" width="160" height="34" rx="8" fill="#FFFFFF" fill-opacity="0.03" stroke="#FFFFFF" stroke-width="1" stroke-opacity="0.08" />
      <text x="394" y="22" fill="#94A3B8" font-family="'SF Mono', monospace" font-size="11">SLA: 24H RESPONSE</text>
    </g>
  </g>
</svg>